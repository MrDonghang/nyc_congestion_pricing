type: pcn
variant: unidirectional        # "unidirectional" | "bidirectional"
batch_length: 360
hidden_sizes: [256, 128]
iterations: 10
activation: relu
coverage_level: 0.9
prediction:
  method: analytic             # "analytic" | "sampling"
  num_samples: 100
training:
  epochs: 200
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  alpha: 10.0                  # constraint loss weight (mu[0] ~ x[-1])
  beta:  0.5                   # derivative-MSE weight
  test_split: 0.2
  val_split: 0.1
  patience: 10
optuna:
  n_trials: 30
  reuse_first_column_params: true
  search_space:
    lr: { type: loguniform, low: 1.0e-5, high: 1.0e-2 }
    weight_decay: { type: loguniform, low: 1.0e-6, high: 1.0e-2 }
    alpha: { type: uniform, low: 1.0, high: 20.0 }
    beta:  { type: uniform, low: 0.1, high: 1.0 }
    hidden1: { type: categorical, choices: [128, 256, 512] }
    hidden2: { type: categorical, choices: [64, 128, 256] }
    iterations: { type: int, low: 5, high: 20 }
    batch_size: { type: categorical, choices: [16, 32, 64] }
